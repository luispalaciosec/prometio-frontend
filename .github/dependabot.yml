version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
    open-pull-requests-limit: 10
    groups:
      # Parches y menores juntos en un solo PR; los major van por separado.
      minor-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Guayaquil
