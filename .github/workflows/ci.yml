name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      # Lo que llega al navegador: falla con cualquier vulnerabilidad high o critical.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      # Herramientas de build (shadcn CLI y transitivas): se reporta, no bloquea.
      - name: Auditoría completa (informativa)
        run: npm audit --audit-level=critical || true
